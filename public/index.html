<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Fest — the front page of your campus</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <!-- AUTH GATE: shown first when signed out -->
  <div id="auth" class="hidden"></div>

  <!-- MAIN APP: shown when signed in -->
  <div id="shell" class="hidden">
    <header class="top">
      <h1><a href="#feed">College Fest</a></h1>
      <span class="sub">the front page of your campus · post anonymously · get paid per read</span>
      <span class="spacer" style="flex:1"></span>
      <span id="who" class="who"></span>
    </header>
    <nav class="tabs" id="nav"></nav>
    <div id="app"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/imageEditor.js"></script>
<script src="/app.js"></script>
</body>
</html>
